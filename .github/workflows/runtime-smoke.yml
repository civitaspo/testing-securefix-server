name: Runtime distribution smoke test
on:
  push:
    branches: [main]
    paths: [.github/workflows/runtime-smoke.yml]
  workflow_dispatch:
permissions: {}
defaults:
  run:
    shell: bash -euo pipefail {0}
jobs:
  produce:
    if: github.repository == 'civitaspo/testing-securefix-server' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Make a harmless archive for verification
        env:
          SOURCE_SHA: ${{ job.workflow_sha }}
        run: |
          mkdir fixture
          printf '%s\n' "$SOURCE_SHA" > fixture/source-sha
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf securefix-runtime-linux-x86_64.tar.gz -C fixture .
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: securefix-runtime-linux-x86_64.tar.gz
          create-storage-record: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: runtime-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: securefix-runtime-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: produce
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.produce.outputs.artifact-id }}
          merge-multiple: true
      - name: Verify the producer archive before publication
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ job.workflow_sha }}
        run: >-
          gh attestation verify securefix-runtime-linux-x86_64.tar.gz
          --repo civitaspo/testing-securefix-server --source-digest "$SOURCE_SHA"
          --source-ref refs/heads/main
          --signer-workflow civitaspo/testing-securefix-server/.github/workflows/runtime-smoke.yml
          --signer-digest "$SOURCE_SHA"
          --cert-oidc-issuer https://token.actions.githubusercontent.com
          --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners
      - name: Publish only the harmless scratch archive
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ job.workflow_sha }}
        run: >-
          gh release create "attestation-smoke-$SOURCE_SHA"
          securefix-runtime-linux-x86_64.tar.gz
          --repo civitaspo/testing-securefix-server --target "$SOURCE_SHA"
          --title "Runtime verification fixture $SOURCE_SHA"
          --notes 'Harmless archive for exact-source attestation verification. No production runtime or policy.'
          --latest=false
  verify:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify exact source and reject changed source, workflow, and bytes
        env:
          SOURCE_SHA: ${{ job.workflow_sha }}
        run: |
          gh --version
          gh release download "attestation-smoke-$SOURCE_SHA" --repo civitaspo/testing-securefix-server --pattern securefix-runtime-linux-x86_64.tar.gz
          gh attestation verify securefix-runtime-linux-x86_64.tar.gz --repo civitaspo/testing-securefix-server --source-digest "$SOURCE_SHA" --source-ref refs/heads/main --signer-workflow civitaspo/testing-securefix-server/.github/workflows/runtime-smoke.yml --signer-digest "$SOURCE_SHA" --cert-oidc-issuer https://token.actions.githubusercontent.com --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners
          if gh attestation verify securefix-runtime-linux-x86_64.tar.gz --repo civitaspo/testing-securefix-server --source-digest 0000000000000000000000000000000000000000; then exit 1; fi
          if gh attestation verify securefix-runtime-linux-x86_64.tar.gz --repo civitaspo/testing-securefix-server --signer-digest 0000000000000000000000000000000000000000; then exit 1; fi
          if gh attestation verify securefix-runtime-linux-x86_64.tar.gz --repo civitaspo/testing-securefix-server --signer-workflow civitaspo/testing-securefix-server/.github/workflows/other.yml; then exit 1; fi
          if gh attestation verify securefix-runtime-linux-x86_64.tar.gz --repo civitaspo/securefix-server; then exit 1; fi
          if gh attestation verify securefix-runtime-linux-x86_64.tar.gz --repo civitaspo/testing-securefix-server --source-ref refs/heads/not-main; then exit 1; fi
          cp securefix-runtime-linux-x86_64.tar.gz altered.tar.gz
          printf 'changed bytes' >> altered.tar.gz
          if gh attestation verify altered.tar.gz --repo civitaspo/testing-securefix-server; then exit 1; fi
          mkdir verified
          tar -xzf securefix-runtime-linux-x86_64.tar.gz -C verified --no-same-owner
          test "$(cat verified/source-sha)" = "$SOURCE_SHA"
      - name: Read another public repository using only this repository token
        run: |
          gh release download v2.102.0 --repo cli/cli --pattern gh_2.102.0_linux_amd64.tar.gz --dir cross-repo
          gh attestation verify cross-repo/gh_2.102.0_linux_amd64.tar.gz --repo cli/cli --cert-oidc-issuer https://token.actions.githubusercontent.com --deny-self-hosted-runners
