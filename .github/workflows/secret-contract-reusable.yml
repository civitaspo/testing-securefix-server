name: Reusable Environment Secret Contract Probe
on:
  workflow_call:
    secrets:
      SECUREFIX_CONTRACT_PROBE:
        required: true
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: secret-contract-probe
    timeout-minutes: 2
    steps:
      - name: Require the environment marker to override the repository marker
        env:
          PROBE_VALUE: ${{ secrets.SECUREFIX_CONTRACT_PROBE }}
        run: test "$PROBE_VALUE" = "environment-marker"
