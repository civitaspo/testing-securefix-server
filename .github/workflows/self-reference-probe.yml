name: Self reference probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    if: github.repository == 'civitaspo/testing-securefix-server' && github.ref == 'refs/heads/main' && github.actor_id == '4525500'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: $/.github/actions/self-probe
