name: Release PR Sync

on:
  push:
    branches: ["release/next"]

permissions: {}
concurrency:
  group: release-pr-sync
  cancel-in-progress: false
jobs:
  sync:
    permissions:
      actions: read
      contents: read
      attestations: write
      pull-requests: write
    uses: civitaspo/securefix-server/.github/workflows/reusable-release-pr-sync.yml@7086c38f918c31f44eb6f63e34235477dd82fb8f # v0.2.45-pre.86
    with:
      server_repository: civitaspo/securefix-server
      instance_config_path: repo-settings/native-role-events-test-instance.toml
