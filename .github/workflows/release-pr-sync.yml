name: Release PR Sync

on:
  push:
    branches:
      - release/next
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pr-sync
  cancel-in-progress: true

jobs:
  sync:
    permissions:
      contents: read
      attestations: read
      pull-requests: write
    uses: civitaspo/securefix-server/.github/workflows/reusable-release-pr-sync.yml@9aede40993d895716ab4c17f69927f8ca9fd4db5 # v0.2.2
