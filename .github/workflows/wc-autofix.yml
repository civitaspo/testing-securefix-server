name: Workflow Autofix (workflow_call)

on:
  workflow_call:
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  autofix:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      attestations: read
    env:
      SECUREFIX_CLIENT_APP_ID: 3872492
      SECUREFIX_SERVER_REPOSITORY: civitaspo/testing-securefix-server
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Force tracked workflow fixture change
        run: printf '\n# Scratch native client integration\n' >> .github/workflows/ci.yml
      - name: Detect automated fixes
        id: fixes
        run: |
          if git diff --quiet -- .github/workflows; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Capture Securefix files
        id: securefix-files
        if: steps.fixes.outputs.changed == 'true'
        run: |
          git ls-files --modified --deleted --others --exclude-standard --deduplicate -z > "$RUNNER_TEMP/securefix-files"
          mapfile -d '' -t files < "$RUNNER_TEMP/securefix-files"
          ((${#files[@]} > 0)) || { echo 'changed files are missing' >&2; exit 1; }
          for file in "${files[@]}"; do
          [[ "$file" != *$'\n'* && "$file" != *$'\r'* && "$file" != ' '* && "$file" != *' ' && "$file" != $'\t'* && "$file" != *$'\t' ]] || { echo 'changed file path cannot be represented' >&2; exit 1; }
          done
          delimiter=securefix-files
          while printf '%s\n' "${files[@]}" | grep -Fqx -- "$delimiter"; do delimiter="${delimiter}x"; done
          { printf 'files<<%s\n' "$delimiter"; printf '%s\n' "${files[@]}"; printf '%s\n' "$delimiter"; } >> "$GITHUB_OUTPUT"

      - name: Prepare exact scratch client input
        env:
          SECUREFIX_SCRATCH_POLICY_BASE64: ""
        run: |
          printf '%s' "$SECUREFIX_SCRATCH_POLICY_BASE64" | base64 --decode > scratch-policy.json
      - name: Create Securefix client token
        id: securefix-client-token
        if: "steps.fixes.outputs.changed == 'true' && env.SECUREFIX_CLIENT_APP_ID != '' && env.SECUREFIX_SERVER_REPOSITORY != ''"
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: "3872492"
          private-key: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
          owner: "civitaspo"
          repositories: "testing-securefix-server"
          permission-issues: write

      - name: "Request Securefix commit"
        id: native-client-action
        if: "steps.fixes.outputs.changed == 'true' && env.SECUREFIX_CLIENT_APP_ID != '' && env.SECUREFIX_SERVER_REPOSITORY != ''"
        uses: "civitaspo/securefix-server/.github/actions/client@828616ad902793c4fec28bcf794b1e9a71549fff" # v0.1.0+828616ad902793c4fec28bcf794b1e9a71549fff
        with:
          runtime-sha: 828616ad902793c4fec28bcf794b1e9a71549fff
          server-repository: "civitaspo/testing-securefix-server"
          runtime-repository: "civitaspo/securefix-server"
          runtime-default-branch: "main"
          policy-path: scratch-policy.json
          repository: "civitaspo/testing-securefix-server"
          branch: securefix-client-smoke-${{ github.run_id }}
          client-token: ${{ steps.securefix-client-token.outputs.token }}
          files: ${{ steps.securefix-files.outputs.files }}
          commit-message: "ci: apply workflow security fixes"

      - name: Verify scratch client action outputs
        env:
          ARTIFACT_NAME: ${{ steps.native-client-action.outputs.artifact-name }}
          SOURCE_LABEL: ${{ steps.native-client-action.outputs.source-label }}
          RUNTIME_SOURCE: ${{ steps.native-client-action.outputs.runtime-source }}
          CLIENT_TOKEN: ${{ steps.securefix-client-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: "civitaspo/testing-securefix-server"
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_NAME"
          test "$ARTIFACT_NAME" = "$SOURCE_LABEL"
          test "$RUNTIME_SOURCE" = attested-release
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" | jq -e --arg name "$ARTIFACT_NAME" '.artifacts | map(select(.name == $name and .expired == false and .size_in_bytes > 0 and .size_in_bytes <= 16777216)) | length == 1' >/dev/null
          label="$(GH_TOKEN="$CLIENT_TOKEN" gh api "/repos/$GITHUB_REPOSITORY/labels/$SOURCE_LABEL")"
          printf '%s' "$label" | jq -e --arg name "$SOURCE_LABEL" --arg description "$GITHUB_REPOSITORY/$GITHUB_RUN_ID" '.name == $name and .description == $description' >/dev/null
          GH_TOKEN="$CLIENT_TOKEN" gh api --method DELETE "/repos/$GITHUB_REPOSITORY/labels/$SOURCE_LABEL"
      - name: Require Securefix configuration
        if: steps.fixes.outputs.changed == 'true' && (env.SECUREFIX_CLIENT_APP_ID == '' || env.SECUREFIX_SERVER_REPOSITORY == '')
        run: |
          echo "Configure SECUREFIX_CLIENT_APP_ID before allowing workflow autofixes." >&2
          exit 1
