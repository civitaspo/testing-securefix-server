name: "testing-Approve Request"

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  issue_comment:
    types:
      - created

permissions: {}

concurrency:
  group: approve-request-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.comment.id || github.run_id }}
  cancel-in-progress: true

jobs:
  approve:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       github.event.comment.user.id == 4525500 &&
       contains(github.event.comment.body, '/approve'))
    permissions:
      actions: read
      contents: read
      attestations: read
      issues: write
      pull-requests: write
    uses: civitaspo/securefix-server/.github/workflows/testing-reusable-approve-request.yml@10334dcb2b5f2e119f1b8724660df29c6a2f0f2a # v0.2.34-pre.2
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
