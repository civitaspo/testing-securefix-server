name: Securefix server Approve

on:
  label:
    types: [created]

permissions: {}

jobs:
  handler:
    if: startsWith(github.event.label.name, 'securefix-native-approve-')
    permissions:
      actions: read
      attestations: read
      contents: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    uses: civitaspo/securefix-server/.github/workflows/reusable-server-approve.yml@6f61872b325644bc98f02b8fa3d41eb30da84a01 # v0.2.45-pre.38 (candidate source)
    with:
      config_path: securefix-server.toml
    secrets:
      SERVER_PRIVATE_KEY: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
      APPROVAL_TOKEN: ${{ secrets.CIVITASPO_BOT_PR_APPROVE_TOKEN }}
