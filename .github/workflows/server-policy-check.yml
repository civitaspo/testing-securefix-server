name: Securefix server Policy Check

on:
  label:
    types: [created]

permissions: {}

jobs:
  handler:
    if: startsWith(github.event.label.name, 'securefix-native-policy-check-')
    permissions:
      actions: read
      attestations: read
      contents: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    uses: civitaspo/securefix-server/.github/workflows/reusable-server-policy-check.yml@5577e7d6735c869b7ac4f77a14eeaa32f03d01de # v0.2.45-pre.27 (candidate source)
    with:
      config_path: securefix-server.toml
    secrets:
      SERVER_PRIVATE_KEY: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
