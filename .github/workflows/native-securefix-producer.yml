name: Native Securefix producer fixture

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  produce:
    if: >-
      github.event.pull_request.user.login == 'civitaspo' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    uses: civitaspo/securefix-server/.github/workflows/request-producer-probe.yml@bf200655844cd60003b8cd612715db6b6d025310 # native producer workflow bf200655844cd60003b8cd612715db6b6d025310
    with:
      operation: securefix
      candidate_run_id: '39803448159'
      candidate_source_sha: 5cca7b5f28c5f08750525347b5b81f0869380e9d
      pull_request_number: ${{ github.event.pull_request.number }}
      server_repository: civitaspo/securefix-server
      instance_config_path: repo-settings/native-securefix-test-instance.toml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      pull-requests: read
