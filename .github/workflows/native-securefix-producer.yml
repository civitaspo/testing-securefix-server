name: Native Securefix producer fixture

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  produce:
    if: >-
      github.event.pull_request.user.login == 'civitaspo' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    uses: civitaspo/securefix-server/.github/workflows/request-producer-probe.yml@c0c9c5f86349b7f822b8b0a45e9dd1f88a2e6cbe # native producer workflow c0c9c5f86349b7f822b8b0a45e9dd1f88a2e6cbe
    with:
      operation: securefix
      candidate_run_id: '39621507109'
      candidate_source_sha: 6c3a50d1f7a1b750329f6f307ac2c1da5fc9bd3e
      pull_request_number: ${{ github.event.pull_request.number }}
      server_repository: civitaspo/securefix-server
      instance_config_path: repo-settings/native-securefix-test-instance.toml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      pull-requests: read
