name: Securefix server Release

on:
  label:
    types: [created]

permissions: {}

jobs:
  handler:
    if: startsWith(github.event.label.name, 'testing-securefix-native-release-')
    permissions:
      actions: read
      attestations: read
      contents: read
      issues: write
      pull-requests: read
      checks: read
      statuses: read
    uses: civitaspo/securefix-server/.github/workflows/reusable-server-release.yml@6e4ebe60e414fa9ec594215dd3c6291f9b34c8ee # v0.2.45-pre.72 (candidate source)
    with:
      config_path: securefix-server.toml
    secrets:
      SERVER_PRIVATE_KEY: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
