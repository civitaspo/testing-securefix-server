name: "testing-Policy Check"

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - "main"

permissions: {}

concurrency:
  group: policy-check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      actions: read
      contents: read
      attestations: read
      pull-requests: read
    uses: civitaspo/securefix-server/.github/workflows/testing-reusable-policy-check.yml@865a26535fb9a1756bf255df9ecbc58199c66c3f # v0.2.43-pre.2
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
