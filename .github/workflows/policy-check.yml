name: testing-Policy Check

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Probe Git fetch auth, produce an attested request, or consume a completed request
        type: choice
        required: true
        options:
          - token-probe
          - produce
          - consume
      candidate_run_id:
        description: Exact successful candidate build run
        type: string
        required: true
        default: "39575187035"
      pull_request_number:
        description: Owner-authored scratch pull request
        type: string
        required: true
        default: "365"
      producer_run_id:
        description: Completed scratch run that produced native-request-proof
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  token-probe:
    if: inputs.mode == 'token-probe'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: native-request-proof
          repository: civitaspo/testing-securefix-server
          run-id: ${{ inputs.producer_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-policy-check
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: civitaspo/securefix-server
          ref: bb260267f65386d5f32bc585bda3090b8b4b7191
          path: server-source
          persist-credentials: false
      - name: Require the exact source-bound candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION_PATH: ${{ github.workspace }}/server-source/.github/actions/setup-cli
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE/server-source" bash "$ACTION_PATH/reuse-build.sh"
          grep -qx "reused=true" "$GITHUB_OUTPUT"
      - uses: civitaspo/securefix-server/.github/actions/install-cli@bb260267f65386d5f32bc585bda3090b8b4b7191 # source commit
        with:
          binary: ${{ github.workspace }}/server-source/target/release/securefix
      - name: Verify the exact request without publishing a check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
        run: |
          set -euo pipefail
          test "$CANDIDATE_RUN_ID" -gt 0
          test "$PRODUCER_RUN_ID" -gt 0
          securefix new-server policy-check \
            --config securefix-server.toml \
            --config-path securefix-server.toml \
            --manifest "$RUNNER_TEMP/native-policy-check/manifest.json" \
            --bundle "$RUNNER_TEMP/native-policy-check/bundle.json"


  produce:
    if: inputs.mode == 'produce'
    uses: civitaspo/securefix-server/.github/workflows/request-producer-probe.yml@82e678f41d53896e4108811e8cff739575960210
    with:
      candidate_run_id: ${{ inputs.candidate_run_id }}
      pull_request_number: ${{ inputs.pull_request_number }}
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      pull-requests: read

  consume:
    if: inputs.mode == 'consume'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: native-request-proof
          repository: civitaspo/testing-securefix-server
          run-id: ${{ inputs.producer_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-policy-check
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: civitaspo/securefix-server
          ref: bb260267f65386d5f32bc585bda3090b8b4b7191
          path: server-source
          persist-credentials: false
      - name: Require the exact source-bound candidate artifact
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION_PATH: ${{ github.workspace }}/server-source/.github/actions/setup-cli
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE/server-source" bash "$ACTION_PATH/reuse-build.sh"
          grep -qx "reused=true" "$GITHUB_OUTPUT"
      - uses: civitaspo/securefix-server/.github/actions/install-cli@bb260267f65386d5f32bc585bda3090b8b4b7191 # source commit
        with:
          binary: ${{ github.workspace }}/server-source/target/release/securefix
      - name: Verify and publish the exact current-head policy check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_NATIVE_CHECK_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$PRODUCER_RUN_ID" -gt 0
          securefix new-server policy-check \
            --config securefix-server.toml \
            --config-path securefix-server.toml \
            --manifest "$RUNNER_TEMP/native-policy-check/manifest.json" \
            --bundle "$RUNNER_TEMP/native-policy-check/bundle.json" \
            --publish
