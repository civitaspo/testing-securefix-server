name: testing-Reaction Permission Probe
on:
  workflow_dispatch:
    inputs:
      comment_id:
        type: string
        required: true
permissions: {}
jobs:
  issues-only:
    if: github.repository == 'civitaspo/testing-securefix-server' && github.actor_id == '4525500' && github.ref == 'refs/heads/testing/reaction-permission-20261020' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Probe PR comment reaction with this job token
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ inputs.comment_id }}
        run: gh api --include -X POST "repos/civitaspo/testing-securefix-server/issues/comments/$COMMENT_ID/reactions" -f content=rocket
  pr-only:
    if: github.repository == 'civitaspo/testing-securefix-server' && github.actor_id == '4525500' && github.ref == 'refs/heads/testing/reaction-permission-20261020' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: read
      pull-requests: write
    steps:
      - name: Probe PR comment reaction with this job token
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ inputs.comment_id }}
        run: gh api --include -X POST "repos/civitaspo/testing-securefix-server/issues/comments/$COMMENT_ID/reactions" -f content=rocket
  both:
    if: github.repository == 'civitaspo/testing-securefix-server' && github.actor_id == '4525500' && github.ref == 'refs/heads/testing/reaction-permission-20261020' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Probe PR comment reaction with this job token
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ inputs.comment_id }}
        run: gh api --include -X POST "repos/civitaspo/testing-securefix-server/issues/comments/$COMMENT_ID/reactions" -f content=rocket
