name: testing-Legacy Reusable Permission Contract
on:
  workflow_dispatch:
permissions: {}
jobs:
  approve:
    if: false
    uses: civitaspo/securefix-server/.github/workflows/reusable-approve-request.yml@f80196051161fe4161c42cd9cb7530cc7db79882 # v0.2.36
    permissions:
      actions: read
      contents: read
      attestations: read
      issues: write
      pull-requests: write
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
  merge:
    if: false
    uses: civitaspo/securefix-server/.github/workflows/reusable-merge-request.yml@f80196051161fe4161c42cd9cb7530cc7db79882 # v0.2.36
    permissions:
      actions: read
      contents: read
      attestations: read
      issues: write
      pull-requests: write
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
