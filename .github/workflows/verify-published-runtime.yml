name: Verify Published Securefix Runtime
on:
  workflow_dispatch:
permissions: {}
jobs:
  load:
    if: github.repository == 'civitaspo/testing-securefix-server' && github.ref == 'refs/heads/main' && github.actor_id == '4525500'
    permissions:
      contents: read
      attestations: read
    uses: civitaspo/securefix-server/.github/workflows/load-cli.yml@7819d4abb70af791715492ec21b20563df4815df
  verify:
    needs: load
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.load.outputs.artifact-id }}
          path: ${{ runner.temp }}/securefix-runtime
          merge-multiple: true
      - uses: civitaspo/securefix-server/.github/actions/install-cli@7819d4abb70af791715492ec21b20563df4815df
        id: install
        with:
          binary: ${{ runner.temp }}/securefix-runtime/securefix
      - name: Verify published CLI and packaged policy
        env:
          SOURCE_SHA: ${{ needs.load.outputs.source-sha }}
          EXPECTED_SOURCE_SHA: 7819d4abb70af791715492ec21b20563df4815df
          SECUREFIX_BINARY: ${{ steps.install.outputs.binary }}
        shell: bash
        run: |
          test "$SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$(command -v securefix)" = "$SECUREFIX_BINARY"
          test "$(stat -c '%a' "$SECUREFIX_BINARY")" = 755
          securefix --help >/dev/null
          securefix policy validate --policy "$RUNNER_TEMP/securefix-runtime/policy.json"
      - name: Validate packaged Securefix configuration
        uses: csm-actions/securefix-action@1b770a7af0ec5e04517295b4e14c4b451359d550 # v0.6.3
        with:
          action: validate-config
          config_file: ${{ runner.temp }}/securefix-runtime/securefix-config.yaml
