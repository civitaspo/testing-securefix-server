name: Securefix server Securefix

on:
  label:
    types: [created]

permissions: {}

jobs:
  handler:
    concurrency:
      group: securefix-control
      cancel-in-progress: false
      queue: max
    if: startsWith(github.event.label.name, 'securefix-native-securefix-')
    permissions:
      actions: read
      attestations: read
      contents: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    uses: civitaspo/securefix-server/.github/workflows/reusable-server-securefix.yml@61c17deefa8877f62c9f593421fd078a75b01608 # v0.2.45-pre.77 (candidate source)
    with:
      config_path: securefix-server.toml
    secrets:
      SERVER_PRIVATE_KEY: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
