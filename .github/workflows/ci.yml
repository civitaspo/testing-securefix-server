name: Scratch CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  status-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate fixture diff without executing repository code
        run: git diff --check HEAD^ HEAD
