name: "testing-Release PR Sync"

on:
  # Managed release PR updates already synchronize their title and body.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pr-sync
  cancel-in-progress: true

jobs:
  sync:
    permissions:
      actions: read
      contents: read
      attestations: read
      pull-requests: write
    uses: civitaspo/securefix-server/.github/workflows/testing-reusable-release-pr-sync.yml@2ed0aecd893b8116e15c46b84e01bcece8020f18 # v0.2.34-pre.16
