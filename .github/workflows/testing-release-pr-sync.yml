name: "testing-Release PR Sync"

on:
  # Managed release PR updates already synchronize their title and body.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pr-sync
  cancel-in-progress: true

jobs:
  sync:
    permissions:
      actions: read
      contents: read
      attestations: read
      pull-requests: write
    uses: civitaspo/securefix-server/.github/workflows/testing-reusable-release-pr-sync.yml@c1195a11ddf07e324f3fc81aadbb55a6935f0d94 # v0.2.34-pre.9
