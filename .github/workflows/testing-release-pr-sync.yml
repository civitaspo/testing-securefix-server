name: "testing-Release PR Sync"

on:
  # Managed release PR updates already synchronize their title and body.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pr-sync
  cancel-in-progress: true

jobs:
  sync:
    permissions:
      actions: read
      contents: read
      attestations: read
      pull-requests: write
    uses: civitaspo/securefix-server/.github/workflows/testing-reusable-release-pr-sync.yml@865a26535fb9a1756bf255df9ecbc58199c66c3f # v0.2.43-pre.2
