name: "testing-Release Tag"

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      release_pr_number:
        description: Merged release/testing-next PR to retry
        required: true
        type: number

permissions: {}

concurrency:
  group: release-tag-${{ github.event.pull_request.number || inputs.release_pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged && github.event.pull_request.head.ref == 'release/testing-next' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      actions: read
      contents: write
      attestations: read
      pull-requests: read
      issues: write
    uses: civitaspo/securefix-server/.github/workflows/testing-reusable-release-tag.yml@865a26535fb9a1756bf255df9ecbc58199c66c3f # v0.2.43-pre.2
    with:
      release_pr_number: ${{ fromJSON(format('{0}', inputs.release_pr_number || github.event.pull_request.number || 0)) }}
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
