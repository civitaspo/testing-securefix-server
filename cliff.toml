# Matches the release tooling configuration used by terraform-provider-sigma.

[changelog]
header = "# Changelog\n\nAll notable changes to this project will be documented here.\n"
body = "{% if version %}\n## [{{ version | trim_start_matches(pat=\"v\") }}] - {{ timestamp | date(format=\"%Y-%m-%d\") }}\n{% else %}\n## [Unreleased]\n{% endif %}\n{% for group, commits in commits | group_by(attribute=\"group\") %}\n### {{ group }}\n\n{% for commit in commits %}- {{ commit.message | split(pat=\"\\n\") | first | trim }}\n{% endfor %}{% endfor %}\n"
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "newest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = ".*", group = "Miscellaneous" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "0.0.0"
